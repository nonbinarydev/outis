# SonarCloud Automatic Analysis.
#
# Automatic Analysis scans the repository directly — no Gradle plugin, no CI step, no token. That also
# means this file is the only place to configure it, since there is no scanner invocation to pass
# properties to.

# BOTH of these must be set together. Declaring sonar.tests without sonar.sources does not fall back to
# the project root for sources — it indexes the test path and nothing else, and the analysis succeeds
# while reporting zero lines of code.
#
# Only the two Kotlin modules are source. Everything else in the repository (docs, site, sample
# catalogue, Gradle wrapper) is either prose or generated, so listing the module trees explicitly is
# both more accurate and less to exclude.
sonar.sources=core/src,ui/src
sonar.tests=core/src/commonTest

# commonTest sits inside core/src, so it has to be excluded from sources or the same files would be
# indexed as both source and test.
sonar.exclusions=core/src/commonTest/**,**/build/**,**/kotlin-js-store/**

# Coverage is deliberately out of scope, and this line is what stops the quality gate failing on a
# metric that can never be supplied: Automatic Analysis cannot ingest coverage reports at all.
sonar.coverage.exclusions=**
