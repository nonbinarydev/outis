<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outis sample</title>
<style>
  html, body { margin: 0; height: 100%; background: #15141A; }
  /* ComposeViewport creates its own canvas inside this container and clears it first, so leave it
     empty. It must have real height or the canvas collapses to nothing. */
  #outis { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="outis"></div>
<!-- Google IMA HTML5 SDK — provides the `google.ima` global the web engine uses for client-side (CSAI)
     ads. Loaded before sample.js so it is ready by the time a CSAI item requests ads. -->
<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
<script src="sample.js"></script>
</body>
</html>
