[versions]
# Tied to the linter in qodana.yaml, which must stay on 2026.2-eap or newer: the 2026.1 image's bundled
# IDE refuses to import anything past AGP 9.0.0 and analyses nothing at all. Lower AGP only together
# with that, never alone.
#
# 9.1.x also matters beyond the linter. AGP 9.0.0 bundles R8 9.0.32, which predates Kotlin 2.4.10 and
# cannot parse its metadata — every build logged "Unexpected error during rewriting of Kotlin metadata"
# for PlayerState, AdEvent$AdCompleted and others. AGP 9.1's R8 reads it, and those are gone.
agp = "9.1.1"
kotlin = "2.4.10"
android-minSdk = "24"
android-compileSdk = "37"

# This and androidx.core below both require compileSdk 37 — checkAarMetadata fails hard on 36, so
# lowering android-compileSdk without also lowering these two breaks the Android build outright.
androidx-lifecycle = "2.11.0"
desugarJdkLibs = "2.1.5"
androidxActivity = "1.13.0"
androidxCore = "1.19.0" # needs compileSdk 37, as androidx-lifecycle above
composePlugin = "1.11.1"
detekt = "1.23.8"
detektCompose = "0.6.3"
detektCompose2 = "1.4.0"
koin = "4.2.2"
ktor = "3.5.1"
coil = "3.5.0"
dokka = "2.2.0"
ktlint = "14.2.0"
guava = "33.6.0-android" # matches the Guava that Media3 resolves; declared so the IDE sees Tracks' ImmutableList
kotlinx-collections-immutable = "0.5.1"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
media3 = "1.10.1"
napier = "2.7.1"
muxData = "1.13.0"       # Mux Data SDK for AndroidX Media3 (supports Media3 1.10.x)
muxEmbed = "5.9.0"       # mux-embed, the Mux Data JS SDK for the HTML <video> element
maven-publish = "0.37.0"

[libraries]
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
detekt-compose2 = { module = "ru.kode:detekt-rules-compose", version.ref = "detektCompose2" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# Analytics adapters only (outis-analytics-mux). The SDK core takes no vendor dependency.
mux-data-media3 = { module = "com.mux.stats.sdk.muxstats:data-media3", version.ref = "muxData" }

# Sample only — the SDK itself ships no DI container and no HTTP client.
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Android — Media3 playback engine (core) and the View-based PlayerView surface (ui).
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-ima = { module = "androidx.media3:media3-exoplayer-ima", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# The ANDROIDX lifecycle, not the org.jetbrains multiplatform one above: ComponentActivity
# implements androidx.lifecycle.LifecycleOwner, so Android code calling it needs this supertype.
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "androidx-lifecycle" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "composePlugin" }
kotlinComposeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
