# Publishes the GitHub Pages site.
#
# Today that is a landing page plus the sample catalogue, which sample applications fetch at runtime.
# The catalogue is served from here rather than from raw.githubusercontent.com because Pages returns
# `content-type: application/json` as well as `access-control-allow-origin: *`; raw returns the CORS
# header but types everything `text/plain`.
#
# The catalogue is validated before publishing. Already-distributed sample apps fetch this file at
# runtime, so a malformed or schema-breaking version cannot be caught by their build — only here.
#
# The web demo at /demo/ is the :sample module's Kotlin/JS browser distribution. Aggregated API docs
# at /api/ are not built yet; see issue #10.
#
# Requires: repository Settings -> Pages -> Source = "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'sample/catalogue.json'
      - 'sample/**'
      - 'site/**'
      - 'docs/img/lockup-*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate the catalogue
        run: python3 sample/validate-catalogue.py

      # Compose for web produces a large bundle (skiko), so this is the slow step by a wide margin.
      # The Mux env key is a repository *variable* (not a secret) — it ships in the client bundle and is
      # public by design. Unset (e.g. on a fork) bakes an empty key and the QoS adapter simply stays off.
      - name: Build the web demo
        run: ./gradlew --no-daemon :sample:jsBrowserDistribution -Pmux.key=${{ vars.MUX_ENVIRONMENT }}

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp sample/catalogue.json _site/catalogue.json
          cp docs/img/lockup-light.svg _site/lockup-light.svg
          cp docs/img/lockup-dark.svg  _site/lockup-dark.svg
          mkdir -p _site/demo
          cp -r sample/build/dist/js/productionExecutable/. _site/demo/
          # skikod8.mjs is skiko's V8-shell build — nothing in a browser references it. The two .wasm
          # files are byte-identical duplicates, but both are referenced from sample.js, so removing
          # either risks a silently blank canvas; left alone deliberately.
          rm -f _site/demo/skikod8.mjs
          echo "demo bundle: $(du -sh _site/demo | cut -f1)"
          # Jekyll would otherwise ignore files and directories beginning with an underscore.
          touch _site/.nojekyll
          echo "--- published files ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
