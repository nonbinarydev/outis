# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

# Compose Multiplatform — required for the Compose canvas on the js target.
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Build performance.
# NOTE: release publishing to Maven Central is not supported with the configuration
# cache — pass --no-configuration-cache on publish tasks.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
