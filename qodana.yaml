#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>

# NOT chosen to match jvmTarget (the modules emit JVM 11 bytecode). 21 is required because the
# Android linter image defaults to Corretto 11 and Gradle 9.6.1 will not start a daemon below JDK 17.
# Setting this to 11 to "match" the target breaks the project import.
projectJDK: "21"

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
# qodana-jvm-community ships NO org.jetbrains.android plugin and no Android SDK, so it cannot create
# a module for androidMain — which is why every `expect` in :ui was reported as having no `actual`.
# qodana-jvm-android is the same IntelliJ IDEA Community base plus the Android plugin and an SDK at
# /opt/android-sdk, and carries the same free Community licence. (Note: "qodana-android", without the
# jvm- prefix, is the Ultimate-tier image and is NOT free — the names are easy to confuse.)
#
# EXPERIMENT (2026-07-23): does the 2026.2 EAP image import AGP 9.1.1?
#
# The 2026.1 image caps at AGP 9.0.0. On 9.1.1 the Gradle build succeeded and the *IDE model import*
# refused outright — "The project is using an incompatible version (AGP 9.1.1)... Latest supported
# version is AGP 9.0.0" — so Qodana analysed nothing. That forced `agp` down to 9.0.0, which in turn
# left the build on an R8 too old for Kotlin 2.4.10's metadata. This tag is the first published image
# that could plausibly lift both.
#
# Failure here is loud and early: an AndroidSyncException during model import, before any analysis
# runs. A pass is therefore unambiguous. If it fails, revert this line AND `agp` together.
#
# CAVEAT if this is kept: `-eap` is a MUTABLE tag — JetBrains re-push it through the EAP cycle (see
# 2026.1-eap, last pushed months before 2026.1 shipped). A green PR can go red with nothing in the
# diff to explain it. Acceptable while experimenting; decide deliberately before leaving it as the
# standing gate, and prefer 2026.2 stable once it exists.
linter: jetbrains/qodana-jvm-android:2026.2-eap

include:
  - name: ConvertTwoComparisonsToRangeCheck
  - name: RemoveExplicitTypeArguments

exclude:
  # Kotlin/Native source sets are NOT skipped by Qodana — they are parsed and inspected against a
  # Linux container that has no Apple platform libraries, so every `platform.AVFoundation` /
  # `platform.Foundation` import resolves to nothing and the whole file reports as broken. Confident
  # garbage is worse than silence, hence excluding by path. This cannot be fixed by configuration:
  # every Qodana linter carrying the Android plugin is Docker/Linux-only, and cinterop-derived
  # Kotlin/Native libraries only exist on a macOS host with Xcode. detekt covers these files instead.
  - name: All
    paths:
      - core/src/iosMain
      - core/src/appleMain
      - ui/src/iosMain
